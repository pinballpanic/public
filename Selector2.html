<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seletor de Configuração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D0F14;
      --panel:     #151820;
      --surface:   #1E2130;
      --border:    #2A2D3E;
      --text:      #E8EAF0;
      --muted:     #6B7280;
      --btn-idle:  #252838;
      --btn-hover: #2E324A;

      --blue:        #2563EB;
      --blue-glow:   #2563eb44;
      --blue-text:   #93C5FD;

      --yellow:      #D97706;
      --yellow-glow: #D9770644;
      --yellow-text: #FCD34D;

      --red:         #DC2626;
      --red-glow:    #DC262644;
      --red-text:    #FCA5A5;

      --neutral-text: #9CA3AF;

      --radius-sm: 8px;
      --radius-lg: 16px;

      --buy-color:  #34D399;
      --sell-color: #F87171;
    }

    /* ── PAGE SHELL ── fills viewport exactly, no scroll */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 24px;
      gap: 0;
    }

    /* ── BLOCK: takes equal halves of the available height ── */
    .block {
      width: 100%;
      max-width: 820px;
      flex: 1;                  /* each block grows to fill half */
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 12px;
      padding: 10px 0;
      min-height: 0;            /* allow flex children to shrink */
    }

    /* ── VERTICAL SIDE LABEL ── */
    .block-side-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 24px;
      flex-shrink: 0;
    }

    .block-label-bar {
      width: 3px;
      flex: 1;
      max-height: 80px;
      border-radius: 2px;
    }
    .block-buy  .block-label-bar { background: var(--buy-color);  }
    .block-sell .block-label-bar { background: var(--sell-color); }

    .block-label-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
    }
    .block-buy  .block-label-text { color: var(--buy-color);  }
    .block-sell .block-label-text { color: var(--sell-color); }

    /* ── BLOCK CONTENT ── */
    .block-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    /* ── RESULT PANEL ── */
    .result-panel {
      width: 100%;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border);
      background: var(--surface);
      padding: 10px 24px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
      transition: border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    }

    .result-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.35s ease;
      white-space: nowrap;
    }

    .result-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.2rem, 2.2vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--neutral-text);
      transition: color 0.35s ease;
      text-align: center;
    }

    /* colour states */
    .result-panel.state-neutral { border-color: var(--border); box-shadow: none; }

    .result-panel.state-blue {
      border-color: var(--blue);
      box-shadow: 0 0 28px var(--blue-glow);
      background: #111827;
    }
    .result-panel.state-blue .result-text  { color: var(--blue-text); }
    .result-panel.state-blue .result-label { color: var(--blue); }

    .result-panel.state-yellow {
      border-color: var(--yellow);
      box-shadow: 0 0 28px var(--yellow-glow);
      background: #111210;
    }
    .result-panel.state-yellow .result-text  { color: var(--yellow-text); }
    .result-panel.state-yellow .result-label { color: var(--yellow); }

    .result-panel.state-red {
      border-color: var(--red);
      box-shadow: 0 0 28px var(--red-glow);
      background: #130F0F;
    }
    .result-panel.state-red .result-text  { color: var(--red-text); }
    .result-panel.state-red .result-label { color: var(--red); }

    /* ── GROUPS GRID ── */
    .groups {
      flex: 1;                  /* fills remaining height inside block-content */
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    /* ── GROUP CARD ── */
    .group-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;  /* vertically centre content */
      gap: 14px;
    }

    .group-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 700;
      color: var(--text);
      text-align: center;
      line-height: 1;
    }

    /* ── BTN SET ── */
    .btn-set { display: flex; flex-direction: column; gap: 6px; }

    .set-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .btn-row { display: flex; gap: 8px; }

    /* ── TOGGLE BUTTON ── */
    .tog-btn {
      flex: 1;
      padding: 10px 8px;
      background: var(--btn-idle);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.1s;
      user-select: none;
    }
    .tog-btn:hover:not(.active) {
      background: var(--btn-hover);
      border-color: #3B4260;
      color: var(--text);
    }
    .tog-btn:active { transform: scale(0.96); }
    .tog-btn.active {
      background: #1E2A4A;
      border-color: var(--blue);
      color: #93C5FD;
      box-shadow: 0 0 10px #2563eb33;
    }

    /* ── DIVIDER ── */
    .block-divider {
      width: 100%;
      max-width: 820px;
      height: 1px;
      background: var(--border);
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* ── RESPONSIVE (mobile) ── */
    @media (max-width: 560px) {
      html, body { overflow: auto; height: auto; }
      body { padding: 14px 12px; }
      .block { flex: none; padding: 10px 0; }
      .groups { grid-template-columns: 1fr; }
      .result-panel { flex-direction: column; gap: 4px; }
      .group-card { padding: 14px 14px; justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <!-- ═══ COMPRAR ═══ -->
  <div class="block block-buy" data-block="buy">
    <div class="block-side-label">
      <div class="block-label-bar"></div>
      <span class="block-label-text">Comprar</span>
      <div class="block-label-bar"></div>
    </div>
    <div class="block-content">
      <div class="result-panel state-neutral">
        <span class="result-label">Configuração</span>
        <span class="result-text">—</span>
      </div>
      <div class="groups">
        <div class="group-card">
          <div class="group-title">50</div>
          <div class="btn-set">
            <span class="set-label">Trend</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="buy" data-group="50" data-set="trend" data-val="TT">TT</button>
              <button class="tog-btn" data-block="buy" data-group="50" data-set="trend" data-val="CT">CT</button>
            </div>
          </div>
          <div class="btn-set">
            <span class="set-label">Region</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="buy" data-group="50" data-set="region" data-val="L1">L1</button>
              <button class="tog-btn" data-block="buy" data-group="50" data-set="region" data-val="L5">L5</button>
            </div>
          </div>
        </div>
        <div class="group-card">
          <div class="group-title">10</div>
          <div class="btn-set">
            <span class="set-label">Trend</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="buy" data-group="10" data-set="trend" data-val="TT">TT</button>
              <button class="tog-btn" data-block="buy" data-group="10" data-set="trend" data-val="CT">CT</button>
            </div>
          </div>
          <div class="btn-set">
            <span class="set-label">Region</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="buy" data-group="10" data-set="region" data-val="L1">L1</button>
              <button class="tog-btn" data-block="buy" data-group="10" data-set="region" data-val="L5">L5</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="block-divider"></div>

  <!-- ═══ VENDER ═══ -->
  <div class="block block-sell" data-block="sell">
    <div class="block-side-label">
      <div class="block-label-bar"></div>
      <span class="block-label-text">Vender</span>
      <div class="block-label-bar"></div>
    </div>
    <div class="block-content">
      <div class="result-panel state-neutral">
        <span class="result-label">Configuração</span>
        <span class="result-text">—</span>
      </div>
      <div class="groups">
        <div class="group-card">
          <div class="group-title">50</div>
          <div class="btn-set">
            <span class="set-label">Trend</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="sell" data-group="50" data-set="trend" data-val="TT">TT</button>
              <button class="tog-btn" data-block="sell" data-group="50" data-set="trend" data-val="CT">CT</button>
            </div>
          </div>
          <div class="btn-set">
            <span class="set-label">Region</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="sell" data-group="50" data-set="region" data-val="L1">L1</button>
              <button class="tog-btn" data-block="sell" data-group="50" data-set="region" data-val="L5">L5</button>
            </div>
          </div>
        </div>
        <div class="group-card">
          <div class="group-title">10</div>
          <div class="btn-set">
            <span class="set-label">Trend</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="sell" data-group="10" data-set="trend" data-val="TT">TT</button>
              <button class="tog-btn" data-block="sell" data-group="10" data-set="trend" data-val="CT">CT</button>
            </div>
          </div>
          <div class="btn-set">
            <span class="set-label">Region</span>
            <div class="btn-row">
              <button class="tog-btn" data-block="sell" data-group="10" data-set="region" data-val="L1">L1</button>
              <button class="tog-btn" data-block="sell" data-group="10" data-set="region" data-val="L5">L5</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      buy:  { '50': { trend: null, region: null }, '10': { trend: null, region: null } },
      sell: { '50': { trend: null, region: null }, '10': { trend: null, region: null } }
    };

    function getColor(t50, r50, t10, r10) {
      const rules = {
        // AZUL
        'TT/L1__TT/L1': 'blue',
        'TT/L1__CT/L5': 'blue',
        // AMARELO
        'CT/L5__CT/L5': 'yellow',
        'TT/L1__CT/L1': 'yellow',
        'TT/L5__TT/L1': 'yellow',
        'CT/L5__TT/L1': 'yellow',
        // VERMELHO
        'CT/L1__CT/L1': 'red',
        'CT/L5__CT/L1': 'red',
        'TT/L1__TT/L5': 'red',
        'TT/L5__TT/L5': 'red',
      };
      return rules[`${t50}/${r50}__${t10}/${r10}`] || null;
    }

    function updateBlock(blockId) {
      const bs = state[blockId];
      const { trend: t50, region: r50 } = bs['50'];
      const { trend: t10, region: r10 } = bs['10'];
      const blockEl = document.querySelector(`.block[data-block="${blockId}"]`);
      const panel   = blockEl.querySelector('.result-panel');
      const txtEl   = blockEl.querySelector('.result-text');

      if (t50 && r50 && t10 && r10) {
        txtEl.textContent = `50(${t50}/${r50}) 10(${t10}/${r10})`;
        panel.className = 'result-panel state-' + (getColor(t50, r50, t10, r10) || 'neutral');
      } else {
        const p50 = (t50 && r50) ? `50(${t50}/${r50})` : (t50||r50) ? `50(${t50||'?'}/${r50||'?'})` : '50(—)';
        const p10 = (t10 && r10) ? `10(${t10}/${r10})` : (t10||r10) ? `10(${t10||'?'}/${r10||'?'})` : '10(—)';
        txtEl.textContent = `${p50} ${p10}`;
        panel.className = 'result-panel state-neutral';
      }
    }

    document.querySelectorAll('.tog-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const { block: blockId, group, set, val } = btn.dataset;
        document.querySelectorAll(
          `.tog-btn[data-block="${blockId}"][data-group="${group}"][data-set="${set}"]`
        ).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state[blockId][group][set] = val;
        updateBlock(blockId);
      });
    });

    updateBlock('buy');
    updateBlock('sell');
  </script>
</body>
</html>
