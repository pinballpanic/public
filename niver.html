<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Idade</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e9ecef;
            color: #343a40;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h1 {
            color: #0056b3;
            margin-bottom: 25px;
            font-size: 2em;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 1.1em;
            text-align: left;
        }
        input[type="text"] {
            width: calc(100% - 22px); /* Ajusta para padding e borda */
            padding: 12px 10px;
            margin-bottom: 20px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        button {
            padding: 12px 25px;
            font-size: 1.1em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        #resultado, #erro {
            margin-top: 25px;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 30px; /* Garante espaço mesmo vazio */
        }
        #resultado {
            color: #28a745; /* Verde para sucesso */
        }
        #erro {
            color: #dc3545; /* Vermelho para erro */
            font-size: 1em;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de Idade</h1>

        <label for="dataAniversario">Data de Aniversario (DD/MM/AAAA):</label>
        <input type="text" id="dataAniversario" placeholder="Ex: 25/12/1990" maxlength="10">

        <button id="calcularIdadeBtn">Calcular Idade</button>

        <p id="erro"></p>
        <p id="resultado"></p>
    </div>

    <script>
        // --- FUNÇÃO PARA MÁSCARA DA DATA ---
        function formatarData(input) {
            let valor = input.value.replace(/\D/g, ''); // Remove tudo que não é dígito
            let dataFormatada = '';

            if (valor.length > 0) {
                dataFormatada = valor.substring(0, 2); // DD
            }
            if (valor.length >= 3) {
                dataFormatada += '/' + valor.substring(2, 4); // MM
            }
            if (valor.length >= 5) {
                dataFormatada += '/' + valor.substring(4, 8); // AAAA
            }
            input.value = dataFormatada;
        }

        // --- FUNÇÃO PARA VALIDAR E CALCULAR IDADE ---
        function calcularIdade() {
            const inputData = document.getElementById('dataAniversario');
            const resultadoParagrafo = document.getElementById('resultado');
            const erroParagrafo = document.getElementById('erro');

            // Limpa mensagens anteriores
            resultadoParagrafo.textContent = '';
            erroParagrafo.textContent = '';

            const dataAniversarioStr = inputData.value;

            // 1. Crítica: Verifica se a entrada está no formato esperado (DD/MM/AAAA) e tem o comprimento correto
            if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dataAniversarioStr)) {
                erroParagrafo.textContent = 'Formato de data inválido. Use DD/MM/AAAA.';
                return;
            }

            // Divide a string da data em dia, mês e ano
            const partes = dataAniversarioStr.split('/');
            const dia = parseInt(partes[0], 10);
            const mes = parseInt(partes[1], 10) - 1; // Mês é base 0 no JavaScript (janeiro = 0)
            const ano = parseInt(partes[2], 10);

            // 2. Crítica: Cria um objeto Date e verifica se a data é válida
            // (Ex: 31/02/2024 seria inválido, assim como 30/FEV/2024)
            const dataNascimento = new Date(ano, mes, dia);

            if (isNaN(dataNascimento.getTime()) || // Verifica se a data é "Not a Date"
                dataNascimento.getDate() !== dia ||
                dataNascimento.getMonth() !== mes ||
                dataNascimento.getFullYear() !== ano) {
                erroParagrafo.textContent = 'Data inválida. Verifique o dia, mês e ano.';
                return;
            }

            // 3. Crítica: Verifica se a data de nascimento não é no futuro
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0); // Zera horas, minutos, segundos e milissegundos para comparação justa

            if (dataNascimento > hoje) {
                erroParagrafo.textContent = 'A data de nascimento não pode ser no futuro!';
                return;
            }

            // --- CÁLCULO DA IDADE ---
            let idadeAnos = hoje.getFullYear() - dataNascimento.getFullYear();
            let idadeMeses = hoje.getMonth() - dataNascimento.getMonth();

            // Ajusta meses e anos se o mês atual for anterior ao mês de aniversário
            // ou se o dia atual for anterior ao dia de aniversário no mesmo mês
            if (idadeMeses < 0 || (idadeMeses === 0 && hoje.getDate() < dataNascimento.getDate())) {
                idadeAnos--;
                idadeMeses += 12; // Adiciona 12 meses para compensar o ano subtraído
            }

            // Se ainda assim o dia de hoje for menor que o dia de aniversário, significa que o mês não está completo
            if (hoje.getDate() < dataNascimento.getDate()) {
                 // Reduz um mês se o aniversário ainda não aconteceu no mês corrente
                 if (idadeMeses > 0) {
                     idadeMeses--;
                 } else { // Se idadeMeses já é 0, significa que voltou um ano completo
                     idadeMeses = 11; // Volta para 11 meses
                     idadeAnos--; // E subtrai um ano novamente, se não já foi feito acima
                 }
            }


            // Garante que o número de meses não exceda 11
            // Isso pode acontecer se, por exemplo, alguém nasceu em 29/02 e hoje é 28/02 do próximo ano.
            // O cálculo inicial pode dar um mês a mais se o dia não for ajustado.
            // O ajuste acima já trata a maioria dos casos, mas esta é uma salvaguarda final.
            if (idadeMeses === 12) {
                idadeMeses = 0;
                idadeAnos++;
            }

            // --- EXIBIÇÃO DO RESULTADO ---
            if (idadeAnos < 0) { // Crítica final para evitar resultados negativos inesperados
                erroParagrafo.textContent = 'Erro no cálculo da idade. Verifique a data.';
            } else if (idadeAnos === 0 && idadeMeses === 0 && hoje.getDate() === dataNascimento.getDate()) {
                resultadoParagrafo.textContent = 'Parabéns! Voce nasceu hoje!';
            } else {
                let mensagemAnos = idadeAnos === 1 ? 'ano' : 'anos';
                let mensagemMeses = idadeMeses === 1 ? 'mês' : 'meses';
                resultadoParagrafo.textContent = `Voce tem ${idadeAnos} ${mensagemAnos} e ${idadeMeses} ${mensagemMeses}.`;
            }
        }

        // --- ADICIONA EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            const inputData = document.getElementById('dataAniversario');
            const calcularBtn = document.getElementById('calcularIdadeBtn');

            // Adiciona a máscara de formatação ao digitar
            inputData.addEventListener('input', () => formatarData(inputData));

            // Adiciona o evento de clique ao botão
            calcularBtn.addEventListener('click', calcularIdade);

            // Opcional: Permite calcular a idade ao pressionar Enter no campo de data
            inputData.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    calcularIdade();
                }
            });
        });
    </script>

</body>
</html>
